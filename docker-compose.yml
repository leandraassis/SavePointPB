services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: savegame-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:18.6-alpine
    container_name: savegame-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: gamelog
      POSTGRES_USER: savegame
      POSTGRES_PASSWORD: savegame
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "savegame", "-d", "gamelog"]
      interval: 10s
      timeout: 5s
      retries: 5

  discoveryserver:
    build: ./discoveryserver
    container_name: savegame-discoveryserver
    ports:
      - "8761:8761"
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  catalogservice:
    build: ./catalogservice
    container_name: savegame-catalogservice
    ports:
      - "8081:8081"
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
      SPRING_RABBITMQ_HOST: rabbitmq
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discoveryserver:8761/eureka
      RAWG_API_KEY: ${RAWG_API_KEY}
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://tempo:4318/v1/traces
      MANAGEMENT_OPENTELEMETRY_LOGGING_EXPORT_OTLP_ENDPOINT: http://loki:3100/otlp/v1/logs
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/catalog
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_DATASOURCE_USERNAME: savegame
      SPRING_DATASOURCE_PASSWORD: savegame
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      discoveryserver:
        condition: service_healthy

  api:
    build: ./api
    container_name: savegame-api
    ports:
      - "8080:8080"
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
      SPRING_RABBITMQ_HOST: rabbitmq
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discoveryserver:8761/eureka
      JWT_SECRET: ${JWT_SECRET}
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://tempo:4318/v1/traces
      MANAGEMENT_OPENTELEMETRY_LOGGING_EXPORT_OTLP_ENDPOINT: http://loki:3100/otlp/v1/logs
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/gamelog
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_DATASOURCE_USERNAME: savegame
      SPRING_DATASOURCE_PASSWORD: savegame
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      discoveryserver:
        condition: service_healthy

  tempo:
    image: grafana/tempo:3.0.3
    container_name: savegame-tempo
    command: ["-target=all", "-config.file=/etc/tempo.yaml"]
    ports:
      - "3200:3200"
      - "4318:4318"
    volumes:
      - ./k8s/monitoring/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    mem_limit: 512m

  loki:
    image: grafana/loki:3.7.8
    container_name: savegame-loki
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
    mem_limit: 512m

  grafana:
    image: grafana/grafana:13.2.2
    container_name: savegame-grafana
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./k8s/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    mem_limit: 384m
    depends_on:
      - tempo
      - loki

volumes:
  rabbitmq-data:
  postgres-data:
  tempo-data:
  loki-data:
  grafana-data:
