apiVersion: v1
kind: Service
metadata:
  name: catalogservice
spec:
  selector:
    app: catalogservice
  ports:
    - port: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalogservice
  template:
    metadata:
      labels:
        app: catalogservice
    spec:
      initContainers:
        - name: wait-dependencies
          image: busybox:1.37
          command: ["sh", "-c", "until nc -z postgres 5432 && nc -z rabbitmq 5672; do sleep 2; done"]
      containers:
        - name: catalogservice
          image: savegame-catalogservice:latest
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: savegame-config
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/catalog
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: RAWG_API_KEY
              valueFrom:
                secretKeyRef:
                  name: savegame-secrets
                  key: RAWG_API_KEY
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
