spring.application.name=gamelog

# H2
spring.datasource.url=jdbc:h2:file:./data/gamelog
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

#Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

#RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.publisher-confirm-type=simple
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=2
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.default-requeue-rejected=false

#JWT
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=15m
jwt.refresh-token-expiration=7d
jwt.refresh-cookie-secure=false

#Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

#Tracing
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces
management.otlp.metrics.export.enabled=false
management.observations.enable.spring.security=false
management.observations.enable.tasks.scheduled=false
spring.rabbitmq.template.observation-enabled=true
spring.rabbitmq.listener.simple.observation-enabled=true

#Logs
management.opentelemetry.logging.export.otlp.endpoint=http://localhost:3100/otlp/v1/logs
